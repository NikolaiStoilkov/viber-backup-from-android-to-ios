<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viber Transfer</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e8;
    --accent: #7360f2; --accent-text: #fff; --ok: #1f9d55; --warn: #b7791f; --bad: #d64545;
    --prompt-bg: #fff7e0; --prompt-line: #f0c75e; --log-bg: #1d1d1f; --log-text: #d8d8de;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --card: #232326; --text: #f2f2f5; --muted: #a1a1a8; --line: #36363b;
      --prompt-bg: #3a3017; --prompt-line: #8a6d1f; --log-bg: #0e0e10; --log-text: #c9c9d1;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .devices { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
  .arrow { align-self: center; font-size: 24px; color: var(--muted); }
  .dev h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 13px;
          background: var(--line); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
  .pill.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .dev .name { font-weight: 600; margin-top: 8px; }
  .dev .msg { color: var(--muted); margin-top: 4px; min-height: 2.9em; }
  .actions { display: flex; gap: 10px; margin: 16px 0; align-items: center; flex-wrap: wrap; }
  button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text);
           padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600;
                   padding: 10px 22px; font-size: 15px; }
  button:disabled { opacity: .45; cursor: default; }
  .prompt { background: var(--prompt-bg); border: 1px solid var(--prompt-line); border-radius: 12px; padding: 14px 16px;
            font-size: 16px; font-weight: 600; margin-bottom: 12px; display: none; }
  .choice { display: none; margin-bottom: 12px; }
  .choice select { width: 100%; margin: 10px 0; padding: 8px; font: inherit; }
  .steps { list-style: none; padding: 0; margin: 0 0 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 4px 16px; }
  .steps li { color: var(--muted); }
  .steps li::before { content: "○ "; }
  .steps li.done { color: var(--text); } .steps li.done::before { content: "✓ "; color: var(--ok); }
  .steps li.current { color: var(--accent); font-weight: 600; } .steps li.current::before { content: "▸ "; }
  .steps li.skipped::before { content: "– "; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }
  .bar.indeterminate > div { width: 30%; animation: slide 1.2s infinite ease-in-out; }
  @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
  .result { margin-top: 12px; font-weight: 600; }
  .result.failed { color: var(--bad); } .result.success { color: var(--ok); } .result.cancelled { color: var(--warn); }
  .summary { display: none; margin-top: 12px; }
  .summary table { border-collapse: collapse; width: 100%; }
  .summary td { padding: 4px 8px 4px 0; vertical-align: top; border-bottom: 1px solid var(--line); }
  .summary td:first-child { color: var(--muted); width: 32%; }
  pre.log { background: var(--log-bg); color: var(--log-text); border-radius: 12px; padding: 12px; height: 260px;
            overflow: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; margin: 12px 0 0; }
  details { margin-top: 16px; }
  summary { cursor: pointer; font-weight: 600; }
  .form { display: grid; grid-template-columns: 180px 1fr; gap: 8px 12px; margin-top: 12px; align-items: center; }
  .form input[type=text], .form select { width: 100%; padding: 6px 8px; font: inherit; border-radius: 6px;
            border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .tools { margin-top: 12px; color: var(--muted); font-size: 13px; }
  .tools code { background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  .section { margin-top: 12px; }
  @media (max-width: 640px) {
    .devices { grid-template-columns: 1fr; } .arrow { transform: rotate(90deg); justify-self: center; }
    .form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>Viber Transfer</h1>
  <p class="sub">Back up Viber from your Android phone to this Mac, then copy a readable export to your iPhone.</p>

  <div class="devices">
    <div class="card dev" id="android"><h2>Android (source)</h2><span class="pill">Checking…</span>
      <div class="name"></div><div class="msg"></div></div>
    <div class="arrow">→</div>
    <div class="card dev" id="iphone"><h2>iPhone (target)</h2><span class="pill">Checking…</span>
      <div class="name"></div><div class="msg"></div></div>
  </div>

  <div class="actions">
    <button class="primary" id="start">Start Transfer</button>
    <button id="cancel" disabled>Cancel</button>
    <span id="hint" style="color:var(--muted)"></span>
  </div>

  <div class="prompt" id="prompt"></div>
  <div class="card choice" id="choice">
    <div id="choice-q" style="font-weight:600"></div>
    <select id="choice-sel"></select>
    <button class="primary" id="choice-go">Continue</button>
  </div>

  <div class="card">
    <ul class="steps" id="steps"></ul>
    <div class="bar" id="bar"><div></div></div>
    <div class="result" id="result"></div>
    <div class="summary" id="summary">
      <table id="summary-table"></table>
      <div class="actions">
        <button id="reveal">Show backup in Finder</button>
        <button id="uninstall">Remove helper app from Android phone…</button>
      </div>
    </div>
    <pre class="log" id="log"></pre>
  </div>

  <details class="card section" id="settings">
    <summary>Settings &amp; tools</summary>
    <div class="form">
      <label for="adb_path">adb path</label><input type="text" id="adb_path" placeholder="auto-detect">
      <label for="android_serial">Android serial</label><input type="text" id="android_serial" placeholder="first connected phone">
      <label for="apk_path">Helper APK</label><input type="text" id="apk_path" placeholder="android-helper build output">
      <label for="ios_target_app">iPhone app for export</label>
      <div style="display:flex;gap:8px"><select id="ios_target_app"><option value="">Ask during transfer</option></select>
        <button id="load-apps" type="button">Load apps</button></div>
      <label for="skip_ios">Skip iPhone step</label><div><input type="checkbox" id="skip_ios"></div>
      <span></span><div><button id="save" type="button">Save settings</button> <span id="saved" style="color:var(--muted)"></span></div>
    </div>
    <div class="tools" id="tools"></div>
  </details>
</main>
<script>
const TOKEN = "__TOKEN__";
const $ = id => document.getElementById(id);
let logFrom = 0, running = false, steps = [], lastChoice = null;

async function post(path, body = {}) {
  const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN},
                               body: JSON.stringify(body)});
  return r.json();
}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pillClass = s => ({connected: "ok", no_root: "warn", unauthorized: "warn", not_trusted: "warn"}[s] || (s === "not_connected" ? "" : "bad"));

function renderDevice(el, d, name) {
  el.querySelector(".pill").className = "pill " + pillClass(d.state);
  el.querySelector(".pill").textContent = d.label || d.state;
  el.querySelector(".name").textContent = name;
  el.querySelector(".msg").textContent = d.message || "";
}

async function refreshStatus() {
  if (running) return;
  try {
    const s = await (await fetch("/api/status")).json();
    const a = s.android, i = s.iphone;
    renderDevice($("android"), a, [a.model, a.viber ? "Viber " + a.viber : ""].filter(Boolean).join(" · "));
    renderDevice($("iphone"), i, [i.name, i.ios_version ? "iOS " + i.ios_version : ""].filter(Boolean).join(" · "));
    $("hint").textContent = s.apk.exists ? "" : "Helper app not built yet (./build-apk.sh) – root copy unavailable.";
    $("tools").innerHTML = "<b>External tools</b><br>" + s.tools.map(t =>
      `${esc(t.name)}: ${t.path ? "✓ " + esc(t.path) : "missing – <code>" + esc(t.install) + "</code>"}`).join("<br>");
    if (!$("settings").dataset.loaded) {
      for (const k of ["adb_path", "android_serial", "apk_path"]) $(k).value = s.settings[k] || "";
      $("skip_ios").checked = !!s.settings.skip_ios;
      if (s.settings.ios_target_app) addOption(s.settings.ios_target_app, s.settings.ios_target_app);
      $("ios_target_app").value = s.settings.ios_target_app || "";
      $("settings").dataset.loaded = "1";
    }
  } catch (e) { /* server restarting */ }
}

function addOption(value, label) {
  if ([...$("ios_target_app").options].some(o => o.value === value)) return;
  const o = document.createElement("option"); o.value = value; o.textContent = label; $("ios_target_app").append(o);
}

function renderSteps(st) {
  steps = st.steps || steps;
  $("steps").innerHTML = steps.map((name, i) => {
    let c = "";
    if ((st.skipped || []).includes(name)) c = "skipped";
    else if (i < st.step_index || (i === st.step_index && st.result === "success")) c = "done";
    else if (i === st.step_index && st.running) c = "current";
    return `<li class="${c}">${esc(name)}</li>`;
  }).join("");
}

const files = n => n === 1 ? "1 file" : `${n} files`;

function renderSummary(s) {
  const rows = [
    ["Saved to", s.backup_dir], ["Method", s.method === "root" ? "Root copy via helper app" : "adb backup"],
    ["Source phone", s.device], ["Viber version", s.viber_version],
    ["Total", `${files(s.files)}, ${s.size}`],
    ...Object.entries(s.folders).map(([k, v]) => [k, `${files(v.files)}, ${v.size}`]),
    ["Conversations", s.conversion_error ? "Conversion failed – see log" : `${s.conversations} (${s.messages} messages)`],
    ["Checksums", s.verified.verified_files ? `All ${s.verified.verified_files} files match the phone's checksums`
                                           : s.verified.ab_sha256 ? "Backup archive unpacked cleanly; hash in manifest" : "—"],
    ["iPhone", `${s.ios.status.toUpperCase()}: ${s.ios.detail}`],
  ];
  $("summary-table").innerHTML = rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("");
  $("summary").style.display = "block";
}

async function poll() {
  try {
    const st = await (await fetch("/api/state?from=" + logFrom)).json();
    running = !!st.running;
    $("start").disabled = running; $("cancel").disabled = !running;
    if (st.log.length) {
      const log = $("log"), atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 20;
      log.textContent += st.log.join("\n") + "\n";
      if (atBottom) log.scrollTop = log.scrollHeight;
    }
    logFrom = st.log_next;
    if (st.steps) renderSteps(st);
    $("prompt").style.display = st.prompt ? "block" : "none";
    $("prompt").textContent = st.prompt ? "👉 " + st.prompt : "";
    const bar = $("bar");
    bar.classList.toggle("indeterminate", running && st.progress == null);
    bar.firstElementChild.style.width = st.progress != null ? st.progress + "%" : (st.result === "success" ? "100%" : "");
    if (st.choice && JSON.stringify(st.choice) !== lastChoice) {
      lastChoice = JSON.stringify(st.choice);
      $("choice-q").textContent = st.choice.question;
      $("choice-sel").innerHTML = st.choice.options.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join("");
    }
    $("choice").style.display = st.choice ? "block" : "none";
    if (!st.choice) lastChoice = null;
    const res = {success: "Transfer finished.", failed: "Stopped: " + (st.error || ""), cancelled: "Cancelled."}[st.result];
    $("result").className = "result " + (st.result || ""); $("result").textContent = res || "";
    if (st.summary) renderSummary(st.summary);
  } catch (e) { /* ignore */ }
}

$("start").onclick = async () => {
  $("log").textContent = ""; logFrom = 0; $("summary").style.display = "none";
  const r = await post("/api/start"); if (!r.ok) alert(r.error);
  running = true; poll();
};
$("cancel").onclick = () => { if (confirm("Stop the transfer? Temporary files on the phone and Mac will be removed. Viber's data is never changed.")) post("/api/cancel"); };
$("choice-go").onclick = () => { post("/api/answer", {value: $("choice-sel").value}); $("choice").style.display = "none"; };
$("reveal").onclick = () => post("/api/reveal");
$("uninstall").onclick = async () => {
  if (!confirm("Remove the “Viber Transfer Helper” app from the Android phone? This deletes only the helper app, not Viber or your chats.")) return;
  const r = await post("/api/uninstall_helper", {confirmed: true});
  alert(r.ok ? "Helper app removed." : "Could not remove it: " + (r.error || r.output));
};
$("load-apps").onclick = async () => {
  $("load-apps").disabled = true;
  const r = await (await fetch("/api/ios_apps")).json();
  $("load-apps").disabled = false;
  if (r.error) return alert(r.error);
  if (!r.apps.length) return alert("No app on the iPhone accepts files over USB. Install a file manager app first.");
  r.apps.forEach(a => addOption(a.bundle_id, `${a.name} (${a.bundle_id})`));
};
$("save").onclick = async () => {
  await post("/api/settings", {adb_path: $("adb_path").value.trim(), android_serial: $("android_serial").value.trim(),
    apk_path: $("apk_path").value.trim(), ios_target_app: $("ios_target_app").value, skip_ios: $("skip_ios").checked});
  $("saved").textContent = "Saved."; setTimeout(() => $("saved").textContent = "", 2000);
  refreshStatus();
};

renderSteps({steps: ["Check tools", "Connect Android phone", "Root access on phone", "Copy Viber data on phone",
  "Pull backup to Mac", "Verify checksums", "Convert chats", "Write manifest", "Copy to iPhone"], step_index: -1});
refreshStatus(); poll();
setInterval(refreshStatus, 4000);
setInterval(poll, 1000);
</script>
</body>
</html>
